name: Build and publish macOS universal release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build signed-for-testing universal app archive
        run: ./build-release.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" RobloxOverlay-macOS-universal.zip --title "$GITHUB_REF_NAME" --notes "Universal macOS build for Apple Silicon and Intel. Requires macOS 15 or later. This build is ad-hoc signed; Gatekeeper may warn on first launch."
